<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>QCM AMF — 1 question/écran + confiance (Firebase)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#191c22;--card:#141820;--txt:#e5e7eb;--muted:#9aa3af;--accent:#6aa9ff;--ok:#10b981;--bad:#ef4444;--border:#2a2f3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#121620;border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px}
  .container{max-width:860px;margin:20px auto;padding:0 14px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{background:var(--accent);color:#0b1020;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  button.secondary{background:#2b3445;color:#e6edf3}
  button.warn{background:#ef4444;color:white}
  button[disabled]{opacity:.55;cursor:not-allowed}
  input,select{padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--txt)}
  .progressbar{height:10px;background:#263144;border-radius:999px;overflow:hidden}
  .progressbar>div{height:100%;width:0%;background:var(--accent);transition:width .25s}
  .screen{display:none}.screen.active{display:block}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted)}
  .q-text{font-size:18px;margin:6px 0 12px}
  .options{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0e1218;cursor:pointer}
  .opt input{accent-color:var(--accent)}
  .opt.good{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.55)}
  .opt.bad{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.55)}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#0b1020;margin-right:6px;background:#ffd166}
  .conf{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .conf label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:#0e1218;cursor:pointer}
  .conf input{accent-color:var(--accent)}
  .meta{display:flex;gap:14px;align-items:center;color:var(--muted)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
  .summary{font-size:15px}
  .who{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>QCM AMF</h1>
  <div id="timer">⏱️ 00:00:00</div>
</header>

<main class="container">
  <!-- Auth -->
  <section class="panel">
    <div class="row">
      <input type="email" id="email" placeholder="Adresse e-mail">
      <input type="password" id="password" placeholder="Mot de passe">
      <button id="signupBtn">Créer un compte</button>
      <button id="loginBtn" style="background:#22c55e">Se connecter</button>
      <button id="logoutBtn" class="warn" disabled>Se déconnecter</button>
      <span id="who" class="who">Non connecté (les résultats ne seront pas sauvegardés)</span>
    </div>
  </section>

  <!-- Setup -->
  <section id="setup" class="panel screen active">
    <div class="row">
      <label>Nombre</label><input type="number" id="count" value="120" min="1" style="width:110px">
      <label>Mode</label>
      <select id="mode">
        <option value="exam">Examen (corrigé à la fin)</option>
        <option value="training">Entraînement (feedback immédiat)</option>
      </select>
      <label>Durée (min)</label><input type="number" id="duration" value="120" min="1" style="width:110px">
      <button id="startBtn">Démarrer</button>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="progressbar" style="flex:1"><div id="setupBar"></div></div>
      <span id="totalSpan" style="color:#9aa3af">Chargement…</span>
    </div>
  </section>

  <!-- Test -->
  <section id="test" class="screen">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="meta">
          <span id="step">Q 1/120</span><span>•</span><span id="modeLabel">Mode : Examen</span>
        </div>
        <div class="row">
          <button id="pauseBtn" class="secondary" disabled>⏸️ Pause</button>
          <button id="resumeBtn" class="secondary" disabled>▶️ Reprendre</button>
          <button id="stopBtn" class="warn" disabled>⏹️ Arrêter</button>
        </div>
      </div>
      <div class="progressbar" style="margin:10px 0 14px"><div id="runBar"></div></div>

      <article id="card" class="q-card">
        <div class="q-head"><span id="qIndex">Question 1</span><span id="perfs">Bonnes : 0</span></div>
        <div id="qText" class="q-text">…</div>
        <div id="opts" class="options"></div>
        <div class="conf">
          <label><input type="radio" name="conf" value="low"> Confiance : Bas</label>
          <label><input type="radio" name="conf" value="mid"> Confiance : Moyen</label>
          <label><input type="radio" name="conf" value="high"> Confiance : Élevé</label>
        </div>
        <div class="nav">
          <button id="prevBtn" class="secondary" disabled>⬅️ Précédent</button>
          <button id="nextBtn" disabled>Suivant ➡️</button>
        </div>
      </article>
    </div>
  </section>

  <!-- Résultats -->
  <section id="results" class="panel screen">
    <h2>Résultats</h2>
    <p class="summary" id="summary">—</p>
    <div class="row" style="margin-top:10px">
      <button id="reviewMistakes" class="secondary">Revoir mes erreurs</button>
      <button id="restart">Recommencer</button>
    </div>
  </section>
</main>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
           signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

  // Config fournie
  const firebaseConfig = {
    apiKey: "AIzaSyDS8sQ8Sni01GZ7393K4kxLRsLm0oJu4as",
    authDomain: "amf-qcm.firebaseapp.com",
    projectId: "amf-qcm",
    storageBucket: "amf-qcm.firebasestorage.app",
    messagingSenderId: "544322848986",
    appId: "1:544322848986:web:4f32743ebc51de84d8fde3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.__fb = { auth, db };
  onAuthStateChanged(auth, (user)=>{
    window.CURRENT_USER = user || null;
    const who = document.getElementById("who");
    const logoutBtn = document.getElementById("logoutBtn");
    if (user){ who.textContent = `Connecté : ${user.email}`; logoutBtn.disabled = false; }
    else { who.textContent = "Non connecté (les résultats ne seront pas sauvegardés)"; logoutBtn.disabled = true; }
  });

  document.getElementById("signupBtn").addEventListener("click", async ()=>{
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    try { await createUserWithEmailAndPassword(auth, email, pass); alert("Compte créé ✅"); }
    catch(e){ alert(e.message || "Erreur inscription"); }
  });
  document.getElementById("loginBtn").addEventListener("click", async ()=>{
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch(e){ alert(e.message || "Erreur connexion"); }
  });
  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    try { await signOut(auth); } catch(e){ console.warn(e); }
  });
</script>

<script>
  // ========= UTIL =========
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  const pad2=n=>String(n).padStart(2,"0");
  const esc=s=>(s||"").toString().replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  const LOCAL_KEY="amf_local_history_v3";

  // ========= ÉTAT =========
  let QUESTIONS=[], PICK=[], CUR=0;
  let MODE="exam";
  let DURATION_SEC=0, leftSec=0, timer=null, paused=false, started=false;
  let correctCount=0, sessionId=null, sessionStart=null;
  const ANSWERS=[]; // {i, choice, correct, confidence, ms}

  // ========= CHARGER QUESTIONS =========
  fetch("questions.json").then(r=>r.json()).then(data=>{
    QUESTIONS=data||[]; $("#totalSpan").textContent="Total : "+QUESTIONS.length+" questions"; $("#setupBar").style.width="100%";
  }).catch(()=>{$("#totalSpan").textContent="⚠️ Impossible de charger questions.json";});

  // ========= ÉCRANS =========
  function show(id){ $$(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }

  // ========= TIMER =========
  function startTimer(){ stopTimer(); leftSec=DURATION_SEC; updateTimer();
    timer=setInterval(()=>{ if(paused) return;
      leftSec=Math.max(0,leftSec-1); updateTimer();
      $("#runBar").style.width = `${(1 - leftSec/DURATION_SEC)*100}%`;
      if(leftSec<=0){ stopTimer(); finish(true); }
    },1000); }
  function stopTimer(){ if(timer) clearInterval(timer); timer=null; }
  function updateTimer(){ const h=Math.floor(leftSec/3600),m=Math.floor((leftSec%3600)/60),s=leftSec%60; $("#timer").textContent=`⏱️ ${pad2(h)}:${pad2(m)}:${pad2(s)}`; }

  // ========= DEMARRER =========
  $("#startBtn").addEventListener("click", async ()=>{
    if(!QUESTIONS.length) return alert("questions.json introuvable.");
    const count=Math.max(1, Math.min(parseInt($("#count").value||"120",10), QUESTIONS.length));
    MODE=$("#mode").value;
    DURATION_SEC=Math.max(1, parseInt($("#duration").value||"120",10))*60;
    correctCount=0; ANSWERS.length=0; paused=false; started=true; sessionId=null; sessionStart=Date.now();

    const base=shuffle([...QUESTIONS]).slice(0,count);
    PICK=base.map(q=>({question:q.question, correct:q.correct,
      options:shuffle([{letter:"A",text:q.a},{letter:"B",text:q.b},{letter:"C",text:q.c}]),
      user:null, conf:null, time_ms:0}));

    CUR=0; show("#test"); render(); startTimer();
    $("#pauseBtn").disabled=false; $("#resumeBtn").disabled=true; $("#stopBtn").disabled=false;
    $("#modeLabel").textContent=`Mode : ${MODE==="exam"?"Examen":"Entraînement"}`;

    // créer doc session (si connecté)
    if (window.CURRENT_USER && window.__fb?.db){
      try{
        const { addDoc, collection, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
        const ref = await addDoc(collection(window.__fb.db, "users", window.CURRENT_USER.uid, "sessions"), {
          createdAt: serverTimestamp(), mode: MODE, total: count, correct: 0, percent: 0,
          durationSec: DURATION_SEC, elapsedSec: 0
        });
        sessionId = ref.id;
      }catch(e){ console.warn("Création session Firestore KO (continuation en local).", e); }
    }
  });

  // ========= RENDU 1 QUESTION =========
  let qStartMs=0;
  function render(){
    const q=PICK[CUR];
    $("#step").textContent=`Q ${CUR+1}/${PICK.length}`;
    $("#qIndex").textContent=`Question ${CUR+1}`;
    $("#qText").innerHTML=esc(q.question);

    const opts=$("#opts"); opts.innerHTML="";
    q.options.forEach(opt=>{
      const lab=document.createElement("label"); lab.className="opt"; lab.dataset.letter=opt.letter;
      const r=document.createElement("input"); r.type="radio"; r.name="answer"; r.value=opt.letter; r.checked=(q.user===opt.letter);
      const span=document.createElement("span"); span.innerHTML=`<span class="badge">${opt.letter}</span>${esc(opt.text)}`;
      lab.append(r,span); opts.appendChild(lab);

      r.addEventListener("change", ()=>{
        if (paused) return;
        q.user=opt.letter;
        // feedback immédiat uniquement en entraînement
        $$(".opt",opts).forEach(o=>o.classList.remove("good","bad"));
        if(MODE==="training"){
          lab.classList.add(opt.letter===q.correct?"good":"bad");
          if(opt.letter===q.correct && !ANSWERS.some(a=>a.i===CUR)) correctCount++;
        }
        $("#perfs").textContent=`Bonnes : ${correctCount}`;
        updateNextState();
      });
    });

    // (ré)appliquer la confiance
    $$("input[name=conf]").forEach(i=>{
      i.checked = (i.value===q.conf);
      i.onchange = ()=>{ if(!paused){ q.conf=i.value; updateNextState(); } };
    });

    $("#prevBtn").disabled = (CUR===0);
    $("#nextBtn").textContent = (CUR===PICK.length-1) ? "Terminer ✅" : "Suivant ➡️";
    updateNextState();

    qStartMs = performance.now();
  }

  function updateNextState(){
    const q=PICK[CUR];
    const ready = !!q.user && !!q.conf;
    $("#nextBtn").disabled = !ready;
  }

  // ========= NAVIGATION =========
  $("#prevBtn").addEventListener("click", ()=>{ if(paused) return; saveCurrentAnswer(); if(CUR>0){CUR--;} render(); });
  $("#nextBtn").addEventListener("click", ()=>{ if(paused) return; saveCurrentAnswer(); if(CUR<PICK.length-1){CUR++; render();} else { finish(false);} });

  function saveCurrentAnswer(){
    const q=PICK[CUR];
    const delta=Math.max(0, performance.now()-qStartMs);
    q.time_ms += delta;
    const row={ i:CUR, choice:q.user, correct:q.correct, confidence:q.conf, ms:Math.round(q.time_ms) };
    const idx=ANSWERS.findIndex(a=>a.i===CUR);
    if(idx>=0) ANSWERS[idx]=row; else ANSWERS.push(row);
  }

  // ========= PAUSE / REPRENDRE / ARRÊTER =========
  $("#pauseBtn").addEventListener("click", ()=>{ if(!started||paused) return; paused=true; $("#pauseBtn").disabled=true; $("#resumeBtn").disabled=false; $$("input[type=radio]").forEach(r=>r.disabled=true); $("#nextBtn").disabled=true; });
  $("#resumeBtn").addEventListener("click", ()=>{ if(!started||!paused) return; paused=false; $("#pauseBtn").disabled=false; $("#resumeBtn").disabled=true; $$("input[type=radio]").forEach(r=>r.disabled=false); updateNextState(); });
  $("#stopBtn").addEventListener("click", ()=>{ if(!started) return; if(!confirm("Arrêter le test ?")) return; saveCurrentAnswer(); finish(true); });

  // ========= FIN & SAUVEGARDE =========
  async function finish(fromTimeUp){
    stopTimer(); saveCurrentAnswer(); started=false; paused=false;

    const total=PICK.length;
    const correct=ANSWERS.filter(a=>a.choice && a.choice===a.correct).length;
    const answered=ANSWERS.filter(a=>a.choice).length;
    const percent=total?Math.round((correct/total)*100):0;
    const elapsedSec=Math.round((Date.now()-sessionStart)/1000);

    const confStats={low:0,mid:0,high:0,lowOk:0,midOk:0,highOk:0};
    ANSWERS.forEach(a=>{ if(!a.confidence) return; confStats[a.confidence]++; if(a.choice===a.correct) confStats[a.confidence+"Ok"]++; });
    const fmt=(n,d)=> d? `${Math.round(100*n/d)}%` : "—";

    $("#summary").innerHTML =
      `Résultat : <b>${correct}/${total}</b> (${percent}%)<br>`+
      `Répondu : ${answered}/${total}`+(fromTimeUp?" • ⏰ Temps écoulé":"")+`<br>`+
      `Confiance — Bas: ${fmt(confStats.lowOk,confStats.low)}, `+
      `Moyen: ${fmt(confStats.midOk,confStats.mid)}, `+
      `Élevé: ${fmt(confStats.highOk,confStats.high)}`;
    show("#results");

    $("#pauseBtn").disabled=true; $("#resumeBtn").disabled=true; $("#stopBtn").disabled=true;

    if (window.CURRENT_USER && window.__fb?.db){
      try{
        const { addDoc, collection, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
        // Créer le résumé de session
        const ref = await addDoc(collection(window.__fb.db, "users", window.CURRENT_USER.uid, "sessions"), {
          createdAt: serverTimestamp(), mode: MODE, total, correct, percent,
          durationSec: DURATION_SEC, elapsedSec
        });
        const ansCol = collection(window.__fb.db, "users", window.CURRENT_USER.uid, "sessions", ref.id, "answers");
        // Enregistrer chaque réponse (avec confiance & temps)
        for (const a of ANSWERS){
          await addDoc(ansCol, {
            i: a.i, userAnswer: a.choice || null, correctAnswer: a.correct,
            isCorrect: !!(a.choice && a.choice===a.correct),
            confidence: a.confidence || null,
            timeMs: a.ms || 0,
            createdAt: serverTimestamp()
          });
        }
      }catch(e){ console.warn("Sauvegarde Firestore KO (fallback local).", e); saveLocal(percent); }
    } else {
      saveLocal(percent);
    }
  }

  // ========= LOCAL FALLBACK =========
  function getLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]"); }catch{ return []; } }
  function saveLocal(p){ const arr=getLocal(); arr.push({t:Date.now(), p}); localStorage.setItem(LOCAL_KEY, JSON.stringify(arr.slice(-100))); }

  // ========= REVIEW / RESTART =========
  $("#reviewMistakes").addEventListener("click", ()=>{
    const wrongIdx=ANSWERS.filter(a=>a.choice && a.choice!==a.correct).map(a=>a.i);
    if(!wrongIdx.length){ alert("Bravo, aucune erreur à revoir !"); return; }
    const subset=wrongIdx.map(i=>PICK[i]);
    PICK=subset.map(q=>({question:q.question, correct:q.correct, options:shuffle([...q.options]), user:null, conf:null, time_ms:0}));
    CUR=0; correctCount=0; paused=false; DURATION_SEC=Math.ceil(subset.length*60);
    show("#test"); render(); startTimer();
    $("#pauseBtn").disabled=false; $("#resumeBtn").disabled=true; $("#stopBtn").disabled=false;
    $("#modeLabel").textContent="Mode : Révision";
  });
  $("#restart").addEventListener("click", ()=>{ show("#setup"); $("#setupBar").style.width="0%"; setTimeout(()=>$("#setupBar").style.width="100%",20); });

  // ========= Raccourcis =========
  document.addEventListener("keydown",(e)=>{
    if (!$("#test").classList.contains("active")) return;
    const mapChoice={ "1":"A","2":"B","3":"C" }; if(mapChoice[e.key]){ const r=$(`input[name=answer][value="${mapChoice[e.key]}"]`); if(r && !r.disabled) r.click(); }
    const mapConf={ "4":"low","5":"mid","6":"high" }; if(mapConf[e.key]){ const r=$(`input[name=conf][value="${mapConf[e.key]}"]`); if(r && !r.disabled) r.click(); }
    if (e.key==="ArrowRight"||e.key==="Enter"){ if(!$("#nextBtn").disabled) $("#nextBtn").click(); }
    if (e.key==="ArrowLeft"){ if(!$("#prevBtn").disabled) $("#prevBtn").click(); }
    if (e.key.toLowerCase()==="p"){ $("#pauseBtn").click(); }
    if (e.key.toLowerCase()==="r"){ $("#resumeBtn").click(); }
  });
</script>
</body>
</html>
